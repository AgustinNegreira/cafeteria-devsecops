apiVersion: v1
kind: Pod
metadata:
  name: reject-latest
  namespace: cafeteria-devsecops
  labels:
    owner: agustin
    purpose: kyverno-validation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: demo
      image: busybox:latest
      command: ["sleep", "600"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
