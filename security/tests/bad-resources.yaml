apiVersion: v1
kind: Pod
metadata:
  name: reject-resources
  namespace: cafeteria-devsecops
  labels:
    owner: agustin
    purpose: kyverno-validation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: demo
      image: busybox:1.37.0
      command: ["sleep", "600"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
