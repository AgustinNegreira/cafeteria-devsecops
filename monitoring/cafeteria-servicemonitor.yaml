apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cafeteria
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [cafeteria-lab4]
  selector:
    matchLabels:
      app.kubernetes.io/name: cafeteria
      app.kubernetes.io/instance: cafeteria
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
