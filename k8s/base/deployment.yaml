apiVersion: apps/v1
kind: Deployment
metadata:
  name: cafeteria-agustin
  labels:
    app: cafeteria-agustin
    owner: agustin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cafeteria-agustin
  template:
    metadata:
      labels:
        app: cafeteria-agustin
        owner: agustin
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: IMAGEN
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: cafeteria-agustin
          env:
            - name: CAFETERIA_PIN
              valueFrom:
                secretKeyRef:
                  name: cafeteria-agustin
                  key: CAFETERIA_PIN
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cafeteria-agustin-data
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
