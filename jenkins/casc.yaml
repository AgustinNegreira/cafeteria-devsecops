# Configuracion de Jenkins como codigo (plugin "configuration-as-code").
# Todo lo que normalmente se hace a mano en la web queda declarado aca.

jenkins:
  systemMessage: "Jenkins local de la cafeteria: CI/CD hacia el cluster de la UCU"
  numExecutors: 2
  # Sin login: solo escucha en 127.0.0.1 (ver docker-compose.yml).
  # En un Jenkins compartido esto seria inaceptable.
  authorizationStrategy: unsecured

unclassified:
  location:
    url: http://localhost:8080/

# Las credenciales se leen de archivos montados como secrets de Docker.
# Ninguna esta en el repo.
credentials:
  system:
    domainCredentials:
      - credentials:
          - file:
              scope: GLOBAL
              id: kubeconfig-ucu
              description: "kubeconfig del namespace alumno-team10"
              fileName: kubeconfig
              secretBytes: "${readFileBase64:/run/secrets/kubeconfig}"
          - usernamePassword:
              scope: GLOBAL
              id: dockerhub
              description: "Docker Hub (token de acceso)"
              username: agustinnegreira
              password: "${readFile:/run/secrets/dockerhub-token}"

# El job: lee el Jenkinsfile del repo y revisa cada minuto si hay commits nuevos.
jobs:
  - script: |
      pipelineJob('cafeteria') {
        description('Tests, build, push y deploy de la cafeteria al cluster de la UCU')
        properties {
          pipelineTriggers {
            triggers {
              pollSCM {
                scmpoll_spec('* * * * *')
              }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('file:///proyecto')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
