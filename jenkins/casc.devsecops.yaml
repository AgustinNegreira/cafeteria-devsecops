jenkins:
  systemMessage: "Cafeteria - Entregable 3 - laboratorio local"
  numExecutors: 1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: agustin
          password: "${readFile:/run/secrets/jenkins-admin-password}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
unclassified:
  location:
    url: http://localhost:8080/
credentials:
  system:
    domainCredentials:
      - credentials:
          - file:
              scope: GLOBAL
              id: kubeconfig-local
              description: "ServiceAccount jenkins-deployer: namespace cafeteria-devsecops, token 24h"
              fileName: kubeconfig
              secretBytes: "${readFileBase64:/run/secrets/kubeconfig-local}"
jobs:
  - script: |
      pipelineJob('cafeteria-devsecops') {
        description('Tests, Semgrep, SCA, KubeLinter, Trivy y deploy local sujeto a Kyverno')
        properties {
          pipelineTriggers {
            triggers {
              pollSCM { scmpoll_spec('* * * * *') }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote { url('file:///proyecto') }
                branch('*/${REPO_BRANCH}')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
